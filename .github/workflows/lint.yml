name: Lint

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        poetry-version: ["2.1.0"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: abatilo/actions-poetry@v3
        with:
          poetry-version: ${{ matrix.poetry-version }}

      - name: Add poetry to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Use in-project virtualenv
        run: poetry config virtualenvs.in-project true

      - name: Restore venv cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-poetry${{ matrix.poetry-version }}-dev-${{ hashFiles('**/poetry.lock') }}

      - name: Install main + dev dependencies
        run: poetry install --with dev

      - name: ruff check
        run: poetry run ruff check protea scripts

      - name: flake8
        run: poetry run flake8 protea

      - name: mypy
        run: poetry run mypy protea

      - name: smell budget (master plan v3.2 §3)
        run: poetry run python scripts/check_smells.py
