name: pr-update-on-develop

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-prs:
    # When develop receives a new commit, every open PR targeting
    # develop becomes "out-of-date" under the strict branch-protection
    # mode. This job rebuilds the merge base for each open PR so CI
    # re-runs against the new develop and (combined with auto-merge)
    # the PR can land without manual "Update branch" clicks.
    #
    # Uses a Personal Access Token (PR_UPDATE_PAT) instead of the
    # default GITHUB_TOKEN. Pushes made by GITHUB_TOKEN do NOT trigger
    # downstream workflow runs (anti-recursion safeguard), which means
    # the merge commit added by `gh pr update-branch` would NOT cause
    # lint/test to re-run. The required checks would then be missing
    # on the new HEAD and auto-merge would block forever. A user PAT
    # bypasses that safeguard so CI fires on the updated branch.
    #
    # The PAT must have `repo` scope (classic) or
    # `Pull requests: write` + `Contents: write` (fine-grained).
    # If the secret is unset, the workflow falls back to the default
    # token and the recursion problem returns until it is configured.
    runs-on: ubuntu-latest
    steps:
      - name: Update every open PR targeting develop
        env:
          GH_TOKEN: ${{ secrets.PR_UPDATE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr list \
            --repo "${{ github.repository }}" \
            --base develop \
            --state open \
            --json number \
            --jq '.[].number' \
          | while read pr; do
              echo "Updating PR #$pr"
              gh pr update-branch "$pr" --repo "${{ github.repository }}" || true
            done
