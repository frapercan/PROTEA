name: Reranker-token lint

# Wires the FARM-EXP.6 reranker-token linter from frapercan/agent-farm.
# Blocks PRs that introduce `vN` reranker shorthand (v3, v9, v18, v22,
# ...) in publishable prose. Only the 9 GOA snapshot tokens (v160 v200
# v210 v215 v220 v226 v227 v229 v230) are allowed.

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    uses: frapercan/agent-farm/.github/workflows/reranker-token-lint.yml@main
    with:
      paths: "docs README.md"
