name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        poetry-version: ["2.1.0"]

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history, so a test that reads a sibling branch's file can
          # reach it. The default is depth 1 of one ref, under which
          # tests/test_per_protein_grid_producer.py skipped its whole round
          # trip against the consumer's reader and still reported green.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: abatilo/actions-poetry@v3
        with:
          poetry-version: ${{ matrix.poetry-version }}

      - name: Add poetry to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Use in-project virtualenv
        run: poetry config virtualenvs.in-project true

      - name: Restore venv cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-poetry${{ matrix.poetry-version }}-test-${{ hashFiles('**/poetry.lock') }}

      - name: Install main + test dependencies
        run: poetry install --with test

      - name: Run unit tests with coverage
        run: poetry run pytest --cov=protea --cov-report=xml --cov-fail-under=65 -q

      # v4 apunta a Node 20, que GitHub deprecio y ya fuerza a Node 24. Bajo
      # Node 24 su cliente TLS se rompe antes de llegar a honrar su propio
      # `fail_ci_if_error: false`, asi que un fallo de la subida tumba el job
      # entero -- lo contrario de lo que este workflow declara. Visto el
      # 2026-10-05 en cuatro corridas de dos ramas distintas:
      #
      #   Required test coverage of 65% reached. Total coverage: 87,82%
      #   Error: write EPROTO ...ssl3_read_bytes:...handshake failure
      #
      # Los tests PASAN en las cuatro. Y la puerta de cobertura no depende de
      # esto: la impone pytest con --cov-fail-under=65 en el paso anterior, asi
      # que la subida es solo para el panel externo y este cambio no relaja
      # ninguna comprobacion.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
# trigger
