# Dev broker configuration, mounted read-only by protea-dev-rabbitmq.container.
#
# The same two settings as docker/rabbitmq/rabbitmq.conf, scaled to the dev
# broker's MemoryMax (2G). That file explains why they are absolute: the
# broker does not read its cgroup limit, so a relative watermark is computed
# against the whole machine, flow control never engages, and the kernel kills
# the broker instead. Keep the watermark under MemoryMax.
vm_memory_high_watermark.absolute = 1400MiB

# Refuse publishers before the dev volume fills, rather than fail in a way
# that reads as success upstream.
disk_free_limit.absolute = 2GB
