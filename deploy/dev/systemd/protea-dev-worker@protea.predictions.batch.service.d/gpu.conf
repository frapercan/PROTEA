[Service]
# The author, 2026-11-21 ("Hagamoslo con la GPU por defecto", let us do it on the
# GPU by default): the first pass of the exact neighbour search runs on the card
# (protea-method, the exact search in two passes). This queue alone sees it;
# embeddings, methods and residue encodings stay off the card. The pass takes the
# card only when it needs less than half of the free memory, releases it before
# returning, and otherwise runs on the CPU with the same neighbours, so the
# production GPU worker that shares the card keeps its room.
Environment=CUDA_VISIBLE_DEVICES=0
