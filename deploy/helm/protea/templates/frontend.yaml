{{- if .Values.frontend.enabled }}
{{- $component := "frontend" -}}
{{- $name := include "protea.componentName" (dict "ctx" . "component" $component) -}}
{{- $apiName := include "protea.componentName" (dict "ctx" . "component" "api") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "protea.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "protea.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "protea.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "protea.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "protea.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "protea.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "protea.frontendImage" . | quote }}
          imagePullPolicy: {{ .Values.frontendImage.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PROTEA_API_URL
              value: "http://{{ $apiName }}:{{ .Values.api.service.port }}"
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.frontend.publicApiUrl | quote }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
{{- end }}
