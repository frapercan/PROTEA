# Prometheus scrape configuration for the PROTEA monitoring stack.
#
# Prometheus runs inside docker-compose.monitoring.yml alongside Grafana
# and Loki, on the protea_monitoring bridge network, and publishes 9090
# on the host. The Grafana "PROTEA Prometheus" datasource
# (deploy/grafana/provisioning/datasources/prometheus.yml, uid
# protea-prometheus) points at http://host.docker.internal:9090 so the
# api-latency / worker-throughput / embeddings-pipeline / db-connections
# dashboards render once this server is scraping.
#
# The PROTEA application stack (api + workers) runs on the host, so the
# protea-api scrape target uses host.docker.internal (mapped to the docker
# host gateway via extra_hosts in the compose service). This mirrors how
# Grafana reaches Postgres and how the loki-docker-driver reaches Loki.
#
# RabbitMQ and the postgres-exporter run in the `protea_default` bridge
# network (compose project "protea"). Prometheus is attached to that
# network (see docker-compose.monitoring.yml networks section) and
# resolves them by container name, so their ports do NOT need to be
# published on the host. This avoids recreating the rabbitmq container
# (which holds durable dead-letter messages on an anonymous volume).
#
# The PROTEA API exposes the Prometheus exposition format at /metrics
# (and the canonical alias /v1/metrics) on port 8000; see
# protea/api/routers/metrics.py and protea/infrastructure/telemetry.py.
# Only the API process serves /metrics; the queue workers do not open
# their own metrics port, so worker-emitted counters surface through the
# shared API registry rather than a per-worker scrape target.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: protea

scrape_configs:
  # PROTEA FastAPI application metrics (protea_* series): HTTP request
  # latency, job counters, embedding/prediction batch histograms, and
  # the DB pool gauge. Powers the api-latency, worker-throughput,
  # embeddings-pipeline, and db-connections (protea_db_pool_* panels)
  # dashboards.
  - job_name: protea-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
        labels:
          service: protea-api

  # Prometheus self-scrape so the up{} series and the server's own
  # health are visible in Grafana.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # RabbitMQ: rabbitmq_prometheus plugin, port 15692.
  # The rabbitmq:3-management image ships rabbitmq_prometheus; the plugin
  # is activated via docker/rabbitmq/enabled_plugins so it works with plain
  # rabbitmq:3 images as well. Prometheus reaches the container by name
  # over the shared `protea_default` network (see docker-compose.monitoring.yml)
  # so port 15692 does NOT need to be published on the host. This avoids
  # recreating the rabbitmq container and losing durable queue state.
  # Powers the queue-depth dashboard (rabbitmq_queue_messages_ready,
  # rabbitmq_queue_messages_unacknowledged, rabbitmq_queue_consumers, etc.).
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - protea-rabbitmq-1:15692
        labels:
          service: rabbitmq

  # Postgres: prometheuscommunity/postgres-exporter, port 9187.
  # The exporter runs as a sidecar in docker-compose.monitoring.yml and
  # connects to host-published Postgres via host.docker.internal:5432.
  # Prometheus reaches it by container name over the shared `protea_monitoring`
  # network (both services are in that network) without needing the host port.
  # Powers the db-connections dashboard (pg_stat_activity_count,
  # pg_stat_database_xact_commit/rollback, pg_stat_activity_max_tx_duration,
  # pg_stat_database_deadlocks).
  - job_name: postgres
    static_configs:
      - targets:
          - protea-postgres-exporter:9187
        labels:
          service: postgres
