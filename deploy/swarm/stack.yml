# PROTEA Docker Swarm stack
#
# Mirrors the docker-compose.yml + docker-compose.prod.yml service set but
# adapted for `docker stack deploy`. Reads sensitive values from Swarm
# secrets (see deploy/swarm/README.md), uses overlay networks, declares
# explicit replicas and rolling-update policies, and pulls pre-built
# images from ghcr.io rather than building locally.
#
# Deploy with:
#   docker stack deploy -c deploy/swarm/stack.yml protea
#
# Validate without deploying:
#   docker stack config -c deploy/swarm/stack.yml > /dev/null
#
# Conventions:
#   - Workers placed on worker nodes (node.role == worker) so the manager
#     stays headroom for the API and stateful services.
#   - Stateful services (postgres, rabbitmq, minio) pinned to manager nodes
#     to keep their volumes co-located with a known host. Operators that
#     run a multi-manager cluster should swap these for a labelled node
#     constraint (node.labels.protea_data == true).
#   - GPU worker (embeddings-batch) uses generic_resources so Swarm only
#     schedules it on nodes that advertise gpu=1.

version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: protea
      POSTGRES_DB: protea
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - protea-data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protea -d protea"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: protea
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password
    networks:
      - protea-data
      - protea-edge
    secrets:
      - rabbitmq_password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: protea
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    volumes:
      - minio_data:/data
    networks:
      - protea-data
    secrets:
      - minio_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  migrate:
    image: ghcr.io/frapercan/protea:${PROTEA_IMAGE_TAG:-latest}
    command: alembic upgrade head
    environment:
      PROTEA_DB_URL_FILE: /run/secrets/protea_db_url
      PROTEA_AMQP_URL_FILE: /run/secrets/protea_amqp_url
    networks:
      - protea-data
    secrets:
      - protea_db_url
      - protea_amqp_url
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
      resources:
        limits:
          memory: 512M

  api:
    image: ghcr.io/frapercan/protea:${PROTEA_IMAGE_TAG:-latest}
    environment:
      PROTEA_DB_URL_FILE: /run/secrets/protea_db_url
      PROTEA_AMQP_URL_FILE: /run/secrets/protea_amqp_url
      PROTEA_ADMIN_TOKEN_FILE: /run/secrets/protea_admin_token
      PROTEA_ALLOWED_ORIGINS: ${PROTEA_ALLOWED_ORIGINS:-}
    networks:
      - protea-data
      - protea-edge
    secrets:
      - protea_db_url
      - protea_amqp_url
      - protea_admin_token
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        delay: 15s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
      placement:
        max_replicas_per_node: 1
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  worker-jobs:
    image: ghcr.io/frapercan/protea:${PROTEA_IMAGE_TAG:-latest}
    command: python scripts/worker.py --queue protea.jobs
    environment:
      PROTEA_DB_URL_FILE: /run/secrets/protea_db_url
      PROTEA_AMQP_URL_FILE: /run/secrets/protea_amqp_url
    networks:
      - protea-data
    secrets:
      - protea_db_url
      - protea_amqp_url
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

  worker-embeddings:
    image: ghcr.io/frapercan/protea:${PROTEA_IMAGE_TAG:-latest}
    command: python scripts/worker.py --queue protea.embeddings
    environment:
      PROTEA_DB_URL_FILE: /run/secrets/protea_db_url
      PROTEA_AMQP_URL_FILE: /run/secrets/protea_amqp_url
    networks:
      - protea-data
    secrets:
      - protea_db_url
      - protea_amqp_url
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  worker-embeddings-batch:
    image: ghcr.io/frapercan/protea:${PROTEA_IMAGE_TAG:-latest}
    command: python scripts/worker.py --queue protea.embeddings.batch
    environment:
      PROTEA_DB_URL_FILE: /run/secrets/protea_db_url
      PROTEA_AMQP_URL_FILE: /run/secrets/protea_amqp_url
    networks:
      - protea-data
    secrets:
      - protea_db_url
      - protea_amqp_url
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
          - node.labels.gpu == true
      update_config:
        parallelism: 1
        order: stop-first
        delay: 30s
      restart_policy:
        condition: any
        delay: 15s
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
          generic_resources:
            - discrete_resource_spec:
                kind: gpu
                value: 1

  worker-embeddings-write:
    image: ghcr.io/frapercan/protea:${PROTEA_IMAGE_TAG:-latest}
    command: python scripts/worker.py --queue protea.embeddings.write
    environment:
      PROTEA_DB_URL_FILE: /run/secrets/protea_db_url
      PROTEA_AMQP_URL_FILE: /run/secrets/protea_amqp_url
    networks:
      - protea-data
    secrets:
      - protea_db_url
      - protea_amqp_url
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M

  worker-predictions-batch:
    image: ghcr.io/frapercan/protea:${PROTEA_IMAGE_TAG:-latest}
    command: python scripts/worker.py --queue protea.predictions.batch
    environment:
      PROTEA_DB_URL_FILE: /run/secrets/protea_db_url
      PROTEA_AMQP_URL_FILE: /run/secrets/protea_amqp_url
    networks:
      - protea-data
    secrets:
      - protea_db_url
      - protea_amqp_url
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  worker-predictions-write:
    image: ghcr.io/frapercan/protea:${PROTEA_IMAGE_TAG:-latest}
    command: python scripts/worker.py --queue protea.predictions.write
    environment:
      PROTEA_DB_URL_FILE: /run/secrets/protea_db_url
      PROTEA_AMQP_URL_FILE: /run/secrets/protea_amqp_url
    networks:
      - protea-data
    secrets:
      - protea_db_url
      - protea_amqp_url
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M

  worker-reaper:
    image: ghcr.io/frapercan/protea:${PROTEA_IMAGE_TAG:-latest}
    command: python scripts/worker.py --queue reaper
    environment:
      PROTEA_DB_URL_FILE: /run/secrets/protea_db_url
      PROTEA_AMQP_URL_FILE: /run/secrets/protea_amqp_url
    networks:
      - protea-data
    secrets:
      - protea_db_url
      - protea_amqp_url
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any
        delay: 15s
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  frontend:
    image: ghcr.io/frapercan/protea-frontend:${PROTEA_FRONTEND_TAG:-latest}
    environment:
      PROTEA_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api-proxy}
    networks:
      - protea-edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        delay: 15s
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 10s
      placement:
        max_replicas_per_node: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  protea-data:
    driver: overlay
    attachable: false
  protea-edge:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

secrets:
  postgres_password:
    external: true
    name: protea_postgres_password
  rabbitmq_password:
    external: true
    name: protea_rabbitmq_password
  minio_password:
    external: true
    name: protea_minio_password
  protea_db_url:
    external: true
    name: protea_db_url
  protea_amqp_url:
    external: true
    name: protea_amqp_url
  protea_admin_token:
    external: true
    name: protea_admin_token
