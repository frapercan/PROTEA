# docker-compose.e2e.yml
#
# CI overlay for scripts/test_deploy_e2e.sh. Pairs with docker-compose.yml
# (-f docker-compose.yml -f docker-compose.e2e.yml). Flips authentication
# off on the api service so the smoke probe can POST /v1/jobs without
# provisioning an API key, and pins the artifact store to local so
# /health/ready does not try to reach a MinIO container the e2e slice
# deliberately excludes (the slice is postgres+rabbitmq+migrate+api+worker-jobs).
#
# Not intended for any other deployment shape; do not reuse outside CI.

services:
  api:
    environment:
      PROTEA_AUTHN_REQUIRED: "false"
      PROTEA_STORAGE_BACKEND: local

  # The deploy smoke posts a ping to protea.jobs and waits 60 seconds for it.
  # Without this the worker spends that window downloading and parsing the NCBI
  # taxonomy dump (about 100 MB, 2.9 million nodes) before it consumes anything,
  # so the ping never runs and the smoke fails on a warm-up that ping does not
  # use. Production keeps the warm-up: doing it at startup rather than mid-batch
  # is the point of it.
  worker-jobs:
    environment:
      PROTEA_SKIP_TAXONOMY_WARMUP: "1"
