# docker-compose.e2e.yml
#
# CI overlay for scripts/test_deploy_e2e.sh. Pairs with docker-compose.yml
# (-f docker-compose.yml -f docker-compose.e2e.yml). Only purpose is to
# flip authentication off on the api service so the smoke probe can POST
# /v1/jobs without provisioning an API key in a freshly migrated DB.
#
# Not intended for any other deployment shape; do not reuse outside CI.

services:
  api:
    environment:
      PROTEA_AUTHN_REQUIRED: "false"
