# Grafana + Loki sidecar for PROTEA (Level A, visitor analytics + logs).
#
# Runs Grafana and Loki on the same `protea_monitoring` bridge network so
# Grafana reaches Loki at http://loki:3100 by container name. Grafana
# publishes 3001 on the host; Loki publishes 3100 on the host so the
# loki-docker-driver running on the application stack can push logs to
# it without a shared compose network (the driver lives outside any
# compose context, so it has to talk to a host-published port).
#
# Postgres still lives in the `pgvectorsql` bridge container which
# publishes 5432 on the host, so Grafana reaches it via the docker0
# gateway (host.docker.internal). `network_mode: host` was tried first
# but this host's Docker puts "host" containers in a netns that's not
# actually the real init netns, so the listener was invisible from the
# outside. Bridge + published port works.
#
# Usage:
#   docker compose -f docker-compose.monitoring.yml up -d
#   open http://localhost:3001   (admin / admin on first login)
#
# Configuring the application stack to ship logs to Loki is a separate
# step that involves installing the `loki-docker-driver` plugin and
# adding a `logging:` block to the api / worker services in
# docker-compose.yml. See docs/source/runbooks/loki.rst for the
# step-by-step procedure.

services:
  grafana:
    image: grafana/grafana:11.3.0
    container_name: protea-grafana
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - protea_monitoring
    depends_on:
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: protea-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      # Published so the loki-docker-driver plugin (which runs in the
      # host's docker daemon namespace, not in this compose project) can
      # push to http://localhost:3100.
      - "3100:3100"
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - protea_monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  protea_monitoring:
    driver: bridge

volumes:
  grafana_data:
  loki_data:
