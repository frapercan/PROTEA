services:

  postgres:
    # PINNED BY DIGEST, NOT BY TAG. The tag says which release this is; the
    # digest says which image. A campaign whose comparisons are sealed cannot
    # rest on a tag that can be repointed under a restart, and the minio entry
    # below shows what that costs when it happens.
    image: pgvector/pgvector:pg18@sha256:1d50c689b0a6511b9ea0a15615281c81a59fd04a08eb35057ec8646fb3a2118a
    # Moved from pg16 to pg18 on 2026-09-14, during the clean-campaign rebuild,
    # because the database was empty: no pg_upgrade, no dump, no restore. The
    # same jump over a populated instance would have meant migrating 27M
    # annotations and 7.6M halfvec rows. The window does not come back.
    #
    # pgvector rides the image and stays at 0.8.5. Nothing to rebuild: the
    # schema stores halfvec and carries NO ANN index, because neighbour search
    # happens outside the database. So the extension upgrade cannot move a
    # recall number, which is the only reason it is safe to do at the same time.
    restart: unless-stopped
    shm_size: 2gb
    # WHY THESE NUMBERS. Measured 2026-08-29 with the container capped at 2G:
    # memory.current sat at 2026 MiB of 2048, the cgroup had hit its ceiling
    # 344,812,307 times, and the kernel had OOM-killed a backend twice, once
    # in the middle of a COMMIT. Only 238 MiB of that was process memory; the
    # rest was page cache being evicted as fast as it was read. A 35 GB
    # database was running with no usable cache on a host with 15 GB free.
    #
    # The settings also disagreed with the cap: effective_cache_size claimed
    # 4 GiB of OS cache inside a 2 GiB box, so the planner chose against a
    # number that did not exist.
    #
    # The arithmetic that has to hold: shared_buffers is taken once, work_mem
    # is taken per sort or hash node per connection. max_connections is 100
    # and the observed concurrency is 16, so 2G + (16 x 16M x a few nodes)
    # leaves room, and even the 100-connection case stays inside 8G. Raising
    # work_mem further without raising the cap is what produced the kill.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
    environment:
      POSTGRES_USER: protea
      POSTGRES_PASSWORD: protea
      POSTGRES_DB: protea
    volumes:
      # MOUNT POINT CHANGED FOR 18+. Up to pg17 this was
      # `postgres_data:/var/lib/postgresql/data`. The 18+ images refuse to start
      # against that layout and say so plainly: they keep data in a
      # major-version-specific subdirectory (`/var/lib/postgresql/18/docker`) so
      # that `pg_upgrade --link` never has to cross a mount boundary. Mounting
      # the volume one level up is the whole fix.
      #
      # Carrying a populated pg16 volume across this would have needed a dump
      # and restore; the volume was empty on 2026-09-14, so it cost a restart.
      - postgres_data:/var/lib/postgresql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protea"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G

  minio:
    # THE REGISTRY CHANGED, AND THE OLD ONE IS GONE. This was
    # `minio/minio:latest` on Docker Hub until 2026-09-14, when that repository
    # stopped existing: `docker pull` answers "pull access denied ... repository
    # does not exist", while other Docker Hub images pull normally, so it is not
    # a rate limit and not authentication. Had the stack been restarted with a
    # cold image cache at any point, storage would simply not have come up.
    #
    # That is the concrete cost of a floating tag. `latest` did not merely fail
    # to pin a version: it pointed at something that has since vanished, and
    # nothing in the file said which image had been running.
    #
    # quay.io is MinIO's own registry. Pinned by digest. Note the community
    # release line stops at 2025-09-07 (the image itself was rebuilt 2026-04),
    # so this dependency is not receiving feature work; whether to stay on it
    # is a decision for the campaign, not for this file.
    image: quay.io/minio/minio@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
    restart: unless-stopped
    profiles: ["storage"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  rabbitmq:
    # Moved from the floating `3-management` to 4.3.5, pinned by digest, on
    # 2026-09-14. A major version normally means enabling every 3.x feature flag
    # before the upgrade and hoping mnesia comes across; here the volume was
    # destroyed the same day, so a 4.x broker starts fresh with its flags
    # already on and there is nothing to migrate. Same window as postgres.
    #
    # `enabled_plugins` and `rabbitmq.conf` carry over unchanged:
    # `vm_memory_high_watermark.absolute` and `disk_free_limit.absolute` are
    # still the spelling in 4.x.
    image: rabbitmq:4.3.5-management@sha256:6e83d26931219c9e088e6eefcc877bcca2adc3690c7603f24f4ece8968b13262
    restart: unless-stopped
    # WHY hostname AND a named volume, together. The broker kept /var/lib
    # /rabbitmq on an ANONYMOUS volume that this file never mentioned, and
    # named its node rabbit@<container id>. Either one alone loses the
    # broker's state on a recreate: without the volume there is no directory,
    # and without a fixed hostname a new container does not recognise the
    # directory it is handed. Nothing said so, and nobody would have found out
    # until a queue came back empty.
    #
    # ADOPTING THIS STARTS A FRESH BROKER. The anonymous volume is not
    # migrated: mnesia is keyed by node name, so the old directory would not
    # be readable under the new one anyway. What is discarded is the 277
    # dead-lettered encode_residue_sparse_batch messages from 2026-08-20 and
    # 21, which are inert (0 consumers, replaying them writes no new rows) and
    # whose damage is independently recorded in job_event as 60
    # child.encode.too_large events. Nothing else in the broker is durable
    # state: the work queues are empty between runs by design.
    hostname: protea-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
      # rabbitmq_prometheus plugin metrics endpoint (enabled by default in the
      # -management images; the enabled_plugins file in docker/ makes it
      # explicit so a plain rabbitmq image also works).
      - "15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          # 512M was too small for what this broker actually carries: the
          # write queues hold embedding vectors in the message body, and a
          # coordinator publishes a whole configuration's batches at once --
          # 2,062 messages for one model over the full corpus. Raised with the
          # watermark above kept under it, so the two numbers cannot disagree
          # again. Still under 14% of this machine's memory.
          memory: 4G

  migrate:
    build: .
    environment:
      PROTEA_DB_URL: postgresql+psycopg://protea:protea@postgres/protea
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      PROTEA_DB_URL: postgresql+psycopg://protea:protea@postgres/protea
      PROTEA_AMQP_URL: amqp://guest:guest@rabbitmq/
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G

  worker-jobs:
    build: .
    environment:
      PROTEA_DB_URL: postgresql+psycopg://protea:protea@postgres/protea
      PROTEA_AMQP_URL: amqp://guest:guest@rabbitmq/
    command: python scripts/worker.py --queue protea.jobs
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

  worker-embeddings:
    build: .
    environment:
      PROTEA_DB_URL: postgresql+psycopg://protea:protea@postgres/protea
      PROTEA_AMQP_URL: amqp://guest:guest@rabbitmq/
    command: python scripts/worker.py --queue protea.embeddings
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

  worker-embeddings-batch:
    build: .
    environment:
      PROTEA_DB_URL: postgresql+psycopg://protea:protea@postgres/protea
      PROTEA_AMQP_URL: amqp://guest:guest@rabbitmq/
    command: python scripts/worker.py --queue protea.embeddings.batch
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G

  worker-embeddings-write:
    build: .
    environment:
      PROTEA_DB_URL: postgresql+psycopg://protea:protea@postgres/protea
      PROTEA_AMQP_URL: amqp://guest:guest@rabbitmq/
    command: python scripts/worker.py --queue protea.embeddings.write
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  worker-predictions-batch:
    build: .
    environment:
      PROTEA_DB_URL: postgresql+psycopg://protea:protea@postgres/protea
      PROTEA_AMQP_URL: amqp://guest:guest@rabbitmq/
    command: python scripts/worker.py --queue protea.predictions.batch
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G

  worker-predictions-write:
    build: .
    environment:
      PROTEA_DB_URL: postgresql+psycopg://protea:protea@postgres/protea
      PROTEA_AMQP_URL: amqp://guest:guest@rabbitmq/
    command: python scripts/worker.py --queue protea.predictions.write
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  worker-reaper:
    build: .
    environment:
      PROTEA_DB_URL: postgresql+psycopg://protea:protea@postgres/protea
      PROTEA_AMQP_URL: amqp://guest:guest@rabbitmq/
    command: python scripts/worker.py --queue reaper
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build:
      context: apps/web
    environment:
      PROTEA_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: /api-proxy
    ports:
      - "3000:3000"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
