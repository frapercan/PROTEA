# The broker's high watermark, pinned in absolute terms.
#
# WHY THIS FILE EXISTS. RabbitMQ sets its watermark as a fraction of what it
# believes it has, and under cgroups v2 the 3-management image does not read
# the container limit: it saw this host's 30 GB and computed 13.12 GB while
# Docker was killing the container at 512 MB. Flow control therefore never
# engaged -- the broker grew past its ceiling into the OOM killer (exit 137)
# and every queue came back empty while all eleven workers still reported
# active. A campaign published into a broker that was not there for nine hours
# and nothing said so.
#
# An absolute value under the container limit makes the broker BLOCK
# publishers rather than die. A stall that announces itself beats a silent one.
# Keep this below the `deploy.resources.limits.memory` in docker-compose.yml;
# the two are meant to be read together.
vm_memory_high_watermark.absolute = 2800MiB

# Disk alarm before the volume fills, for the same reason: refuse politely
# instead of failing in a way that reads as success upstream.
disk_free_limit.absolute = 2GB
