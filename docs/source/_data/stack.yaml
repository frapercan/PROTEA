# PROTEA stack registry: single source of truth.
#
# Edit this file to add, rename, or retire a repository. Then run:
#     poetry run python scripts/sync_stack.py
# to regenerate the README block in this repo and the Sphinx page.
#
# Statuses:
#   active   : in regular use, accepting changes
#   beta     : released but small surface area, expect breakage
#   skeleton : bootstrapped, no real code yet (F2 plugin migration pending)
#   archived : no longer maintained
#
# Roles group repos in the navigation tables.

repos:
  - name: PROTEA
    slug: protea-core
    role: platform
    role_label: Platform
    status: active
    summary: Backend platform. Hosts the ORM, job queue, FastAPI surface, frontend, and orchestration.
    summary_es: Plataforma backend. Aloja el ORM, la cola de trabajos, la superficie FastAPI, el frontend y la orquestación.
    github_url: https://github.com/frapercan/PROTEA
    docs_url: https://protea.readthedocs.io/
    package_url: null

  - name: protea-contracts
    slug: protea-contracts
    role: contracts
    role_label: Contracts
    status: active
    summary: Shared contract surface. ABCs, pydantic payloads, feature schema, schema_sha. Imported by every other repo.
    summary_es: Superficie de contratos compartida. ABCs, payloads de pydantic, esquema de features, schema_sha. Importada por todos los demás repos.
    github_url: https://github.com/frapercan/protea-contracts
    docs_url: https://protea-contracts.readthedocs.io/
    package_url: https://github.com/frapercan/protea-contracts/releases

  - name: protea-method
    slug: protea-method
    role: inference
    role_label: Inference
    status: active
    summary: Pure inference path (KNN, feature compute, reranker apply). Delegation target for the F2C extraction; live in production since F2C.5b. Bind-mounted by the LAFA containers.
    summary_es: Ruta de inferencia pura (KNN, cálculo de features, aplicación del reranker). Destino de delegación de la extracción F2C; en producción desde F2C.5b. Montado por bind en los contenedores LAFA.
    github_url: https://github.com/frapercan/protea-method
    docs_url: https://protea-method.readthedocs.io/
    package_url: null

  - name: protea-sources
    slug: protea-sources
    role: plugin
    role_label: Source plugin
    status: active
    summary: Annotation source plugins (GOA, QuickGO, UniProt). Discovered via Python entry_points (goa, quickgo, uniprot).
    summary_es: Plugins de fuentes de anotación (GOA, QuickGO, UniProt). Descubiertos mediante entry_points de Python (goa, quickgo, uniprot).
    github_url: https://github.com/frapercan/protea-sources
    docs_url: https://protea-sources.readthedocs.io/
    package_url: null

  - name: protea-runners
    slug: protea-runners
    role: plugin
    role_label: Runner plugin
    status: active
    summary: Experiment runner plugins (LightGBM, KNN, baseline). Discovered via Python entry_points (lightgbm, knn, baseline).
    summary_es: Plugins de ejecutores de experimentos (LightGBM, KNN, baseline). Descubiertos mediante entry_points de Python (lightgbm, knn, baseline).
    github_url: https://github.com/frapercan/protea-runners
    docs_url: https://protea-runners.readthedocs.io/
    package_url: null

  - name: protea-backends
    slug: protea-backends
    role: plugin
    role_label: Backend plugin
    status: active
    summary: Protein language model embedding backends (ESM family, T5/ProstT5, Ankh, ESM3-C). Discovered via Python entry_points (esm, t5, ankh, esm3c).
    summary_es: Backends de embeddings de modelos de lenguaje de proteínas (familia ESM, T5/ProstT5, Ankh, ESM3-C). Descubiertos mediante entry_points de Python (esm, t5, ankh, esm3c).
    github_url: https://github.com/frapercan/protea-backends
    docs_url: https://protea-backends.readthedocs.io/
    package_url: null

  - name: protea-reranker-lab
    slug: protea-reranker-lab
    role: lab
    role_label: Lab
    status: active
    summary: LightGBM reranker training lab. Pulls datasets from PROTEA, trains boosters, publishes them back via /reranker-models/import-by-reference.
    summary_es: Laboratorio de entrenamiento del reranker LightGBM. Descarga datasets de PROTEA, entrena boosters y los publica de vuelta mediante /reranker-models/import-by-reference.
    github_url: https://github.com/frapercan/protea-reranker-lab
    docs_url: https://protea-reranker-lab.readthedocs.io/
    package_url: null

  - name: cafaeval-protea
    slug: cafaeval-protea
    role: tool
    role_label: Evaluator
    status: active
    summary: Standalone fork of cafaeval (CAFA-evaluator-PK) with the PK-coverage fix and a bit-exact parity guarantee against the upstream.
    summary_es: Fork independiente de cafaeval (CAFA-evaluator-PK) con la corrección de cobertura PK y una garantía de paridad bit a bit con el upstream.
    github_url: https://github.com/frapercan/cafaeval-protea
    docs_url: https://cafaeval-protea.readthedocs.io/
    package_url: null
