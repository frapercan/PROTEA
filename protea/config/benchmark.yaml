# Benchmark matrix configuration.
#
# Controls how `/benchmark/matrix` classifies and orders evaluation results for
# the UI. Adding a new scoring config or PLM should NOT require editing this
# file unless you want a custom label or a different default stage.

# Stage taxonomy -----------------------------------------------------------
stages:
  # Preferred stage to select on initial page load. The first entry that
  # actually has data wins; otherwise falls back to the first stage seen.
  # The board opens on the FIRST of these that has data, so this list is a
  # claim about what a reader arriving with no opinion should be shown.
  #
  # It used to open on embedding_only, chosen when it was the widest-covered
  # stage and the only alternative was a handful of others. Rung 1 has since
  # measured all nine on one frame, and embedding_only is the second worst:
  #
  #     composite_no_embedding 0.2982   alignment_only        0.2854
  #     composite              0.2978   embedding_plus_vote   0.2833
  #     embedding_plus_align   0.2852   vote_fraction         0.2780
  #     embedding_only         0.2497   evidence_veto         0.2189
  #     knn (the None fallback) 0.2497
  #
  # composite leads because it is the method as configured, not because it
  # won: composite_no_embedding is four ten-thousandths above it and opening
  # on an ablation arm would make the board assert a result the campaign has
  # not finished checking. The baseline stays reachable and stays named as
  # the baseline; it just stops being the first thing anyone sees.
  #
  # knn is the None-scoring fallback and is arithmetically embedding_only,
  # measured identical to four decimals across all 48 arms, so it sits
  # beside it rather than anywhere its ordering would imply a difference.
  preferred_default:
    - composite
    - composite_no_embedding
    - embedding_plus_alignment
    - embedding_plus_vote
    - alignment_only
    - vote_fraction
    - embedding_only
    - knn
    - evidence_veto

  # Scoring configs the frontend should highlight as the "reference / raw
  # embedding" baseline in the leaderboard. The name must match an entry in
  # `scoring_config.name`. Optional.
  baseline_scoring_name: embedding_only

  # Names to hide from the benchmark UI entirely (results still exist in the
  # DB, they just are not returned by the matrix endpoint).
  hidden: []

  # Human-readable labels. Any scoring config not listed here falls back to
  # a Title-Cased version of its own `name`.
  labels:
    # A run with no scoring config and no re-ranker: the neighbour vote
    # on its own. The baseline the other stages are measured against.
    knn: "KNN baseline"
    embedding_only: "Embedding-only"
    vote_fraction: "Vote fraction (KNN)"
    alignment_only: "Alignment-only"
    embedding_plus_alignment: "Embedding + alignment"
    embedding_plus_vote: "Embedding + vote"
    evidence_veto: "Evidence veto"
    composite: "Composite"
    reranker: "Re-ranker"

# Evaluation set labels ----------------------------------------------------
# Optional override for how evaluation sets appear in selectors.
# Key: evaluation_set_id UUID. Value: label string.
# When absent, the backend auto-generates a label from the annotation set
# versions + delta stats.
eval_set_labels: {}

# Hidden embeddings --------------------------------------------------------
# embedding_config UUIDs to suppress from the benchmark UI entirely. The
# rows still exist in the DB (no data is deleted), they are simply omitted
# from `/benchmark/embeddings` and `/benchmark/matrix` so the matrix shows
# only the canonical PLMs without empty / duplicate rows. Reversible: drop a
# UUID from this list to bring its row back.
#
# Current entries are the 3 orphan configs classified in ADR D35:
#   - c85d1afe-... esmc_300m            (superseded by esmc_600m)
#   - c2868c1a-... ElnaggarLab/ankh-base (duplicate config, no display_name)
#   - db4db5ed-... Rostlab/prot_t5_xl_uniref50 (full uniref50, vs canonical half)
hidden_embeddings:
  - c85d1afe-3f49-4ead-82d9-faaa6efe7a2c
  - c2868c1a-0966-47a0-9941-2213fe6d22fa
  - db4db5ed-e34a-47af-a9ab-cc0f230b0a8c

# GO namespace metadata ----------------------------------------------------
# These are ontological constants, but exposing them here keeps the frontend
# fully driven by the API response and allows non-standard evaluation splits
# in the future (e.g. IEA-only vs experimental).
categories: [NK, LK, PK]
aspects: [BPO, MFO, CCO]
