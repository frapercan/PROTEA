[project]
name = "protea"
version = "0.8.0"
description = "PROtein funcTional Embedding-based Annotation: distributed platform for GO term prediction via PLM embeddings, KNN transfer, and learned re-ranking."
authors = [
    {name = "frapercan",email = "frapercan1@alum.us.es"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "alembic (>=1.18.4,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "fastapi (>=0.135.1,<0.136.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pika (>=1.3.0,<2.0.0)",
    "pgvector (>=0.4.2,<1.0.0)",
    "numpy (>=1.26.0,<3.0.0)",
    "transformers (>=4.40.0,<5.0.0)",
    "torch (>=2.0.0)",
    "torchvision (>=0.15.0)",
    "sentencepiece (>=0.2.1,<0.3.0)",
    "esm (>=3.2.1)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "faiss-cpu (>=1.7.0)",
    "parasail (>=1.3.4)",
    "ete3 (>=3.1.3)",
    "cafaeval-protea @ git+https://github.com/frapercan/cafaeval-protea.git@main",
    "lightgbm (>=4.6.0,<5.0.0)",
    "pyarrow (>=23.0.1,<24.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pyjwt (>=2.10.0,<3.0.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "pydantic-settings (>=2.0,<3.0)",
    "prometheus-client (>=0.20.0,<1.0.0)",
]

[project.optional-dependencies]
storage = ["minio (>=7.2,<8.0)"]


[tool.poetry.dependencies]
# Default torch + torchvision install the CPU wheels from the PyTorch CPU
# index, dropping the ~6 GB NVIDIA/triton stack that the CI runners and the
# slim production Docker image never use. GPU embedding workers override
# torch post-install via ``scripts/install_gpu_torch.sh``
# (see CLAUDE.md "GPU torch override"). torchvision is pulled in transitively
# by ``esm``; pinning it to the same source keeps ABI parity with torch+cpu
# (otherwise ``transformers`` errors out with ``operator torchvision::nms
# does not exist``).
torch = {source = "pytorch-cpu"}
torchvision = {source = "pytorch-cpu"}
uvicorn = ">=0.41.0,<0.42.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[tool.poetry.group.plugins.dependencies]
# F0 T0.15 of master plan v3: protea-core references the C-stack repos
# as a poetry group so contributors can install with
# ``poetry install --with plugins`` once the bootstrap repos exist on
# disk. Real ABCs / payloads land in F1 (T1.1-T1.5); during F0 these
# packages export only their version sentinel and entry_point stubs,
# which is enough to validate the multi-repo layout.
protea-contracts = { git = "https://github.com/frapercan/protea-contracts.git", branch = "master" }
protea-method = { git = "https://github.com/frapercan/protea-method.git", branch = "master" }
protea-sources = { git = "https://github.com/frapercan/protea-sources.git", branch = "master" }
protea-runners = { git = "https://github.com/frapercan/protea-runners.git", branch = "master" }
protea-backends = { git = "https://github.com/frapercan/protea-backends.git", branch = "master" }


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.group.lint]
optional = true
[tool.poetry.group.lint.dependencies]
# Static analysis only. Lint CI installs ``--with lint`` (main + lint).
ruff = ">=0.15.5,<0.16.0"
mypy = ">=1.19.1,<2.0.0"
types-requests = "^2.32.4.20260107"
types-pyyaml = "^6.0.12.20250915"
taskipy = ">=1.10.3"


# T5.1a (D7 accepted 2026-05-06): OpenTelemetry SDK + OTLP HTTP exporter
# + FastAPI instrumentor. Kept in its own optional poetry group so
# developer / CI installs stay slim while deploy targets opt in with
# ``poetry install --with telemetry``. T5.1b extends this group with
# the SQLAlchemy + pika instrumentors.
[tool.poetry.group.telemetry]
optional = true
[tool.poetry.group.telemetry.dependencies]
opentelemetry-api = ">=1.27.0,<2.0.0"
opentelemetry-sdk = ">=1.27.0,<2.0.0"
opentelemetry-exporter-otlp-proto-http = ">=1.27.0,<2.0.0"
opentelemetry-instrumentation-fastapi = ">=0.48b0,<1.0.0"
# T5.1b: SQLAlchemy engine spans + W3C traceparent propagation through
# pika. The pika library does not have an OTel instrumentor of its own;
# producer/consumer spans are wired by hand in publisher.py + consumer.py
# using opentelemetry.propagate (shipped with opentelemetry-api).
opentelemetry-instrumentation-sqlalchemy = ">=0.48b0,<1.0.0"


[tool.poetry.group.test]
optional = true
[tool.poetry.group.test.dependencies]
# Unit + integration test runtime. Includes ``protea-reranker-lab`` because
# ``test_predict_go_terms.py`` and ``test_reranker.py`` import
# ``protea_reranker_lab.contracts.compute_feature_schema_sha`` to assert
# parity with the offline trainer.
pytest = ">=9.0.2,<10.0.0"
pytest-cov = ">=7.0.0,<8.0.0"
coverage = {extras = ["toml"], version = ">=7.2.1"}
protea-reranker-lab = {git = "https://github.com/frapercan/protea-reranker-lab.git", branch = "main"}


[tool.poetry.group.docs]
optional = true
[tool.poetry.group.docs.dependencies]
# Sphinx build. Heavy autodoc imports rely on ``main`` deps too, so docs
# CI installs ``--with docs`` (which implies ``--with main``).
sphinx = ">=7.2.6"
furo = ">=2024.8.6"
sphinx-copybutton = ">=0.5.2"
sphinx-design = ">=0.6.1"
shibuya = ">=2025.9.24"
sphinxcontrib-bibtex = "^2.7.0"


[tool.taskipy.tasks]
lint     = "ruff check protea scripts"
format   = "ruff format protea scripts"
typecheck = "mypy protea"
coverage = "coverage run -m pytest tests && coverage report -m"
html_docs = "make html -C docs"
docs     = "python scripts/build_docs.py"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# F0 ruleset: keeps the existing baseline (E/F/W/I/UP/B) and ignores
# enforced for project conventions. Master plan v3 F-OPS phase will
# extend this to the full ruff catalog (N, RUF, SIM, PT, etc.).
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.bandit]
# Bandit security scan (run via .github/workflows/security.yml).
# Skips test files (assert statements + magic mocks would create noise)
# and the lab archeology that lives outside protea/.
exclude_dirs = ["tests", "scripts/dump_reranker_dataset.py"]
# B404: subprocess import (legitimate in scripts/manage.sh wrappers).
# B603: subprocess call without shell=True (we use it correctly).
# B101: assert_used (assertions in non-test code; project keeps a few).
skips = ["B404", "B603", "B101"]

[tool.ruff.lint.per-file-ignores]
# Standalone runner scripts insert PROJECT_ROOT into sys.path before
# importing the protea package, so module-level imports cannot live at
# the top of the file. The pattern is deliberate (lets `python scripts/foo.py`
# work without `poetry install` first); silencing E402 instead of moving
# the imports keeps the runner self-contained.
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false
[[tool.mypy.overrides]]
module = [
    "protea.core.operations.*",
    "protea.api.routers.*",
]
ignore_errors = true

[tool.coverage.run]
source = ["protea"]
omit = ["*/site-packages/*"]

[tool.coverage.report]
fail_under = 65
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "pass",
]
