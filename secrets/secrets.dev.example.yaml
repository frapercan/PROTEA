# Example plaintext template for the development secrets file.
#
# DO NOT FILL IN REAL VALUES HERE. This file is committed and only
# exists so contributors know the schema. Copy it to
# `secrets/secrets.dev.yaml`, populate, and run:
#
#   sops --encrypt --in-place secrets/secrets.dev.yaml
#   git mv secrets/secrets.dev.yaml secrets/secrets.dev.enc.yaml
#
# After encryption the file is safe to commit.

database:
  url: "postgresql+psycopg://USER:PASSWORD@HOST:5432/protea"

queue:
  amqp_url: "amqp://USER:PASSWORD@HOST:5672/"

storage:
  minio:
    endpoint: "HOST:9000"
    bucket: "protea"
    access_key: "MINIO_ACCESS_KEY"
    secret_key: "MINIO_SECRET_KEY"
    secure: false

admin:
  token: "ADMIN_TOKEN"

github:
  release_token: "ghp_PAT_FOR_RELEASE_AUTOMATION"
